[package]
name = "blazers-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust client SDK for the Blazers BaaS — auth, records, files, realtime, flags, functions, batch. Compiles to wasm32 for Node/browser usage."

# `cdylib` is what wasm-bindgen/wasm-pack consume for the JS bundle.
[lib]
crate-type = ["rlib", "cdylib"]

# wasm-pack's bundled wasm-opt rejects the wasm features current rustc emits
# (e.g. i64.trunc_sat_f64_s) — skip the opt pass; size is fine for a client SDK.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "=2.0.21"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "net"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "=0.3.34"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
serde-wasm-bindgen = "=0.6.5"
web-sys = { version = "=0.3.107", features = [
    "Window", "Request", "RequestInit", "RequestMode", "Response", "Headers",
    "FormData", "Blob", "BlobPropertyBag", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent",
    "Event", "console",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
